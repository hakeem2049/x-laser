function validateBook(b){if(!b||b.schema!==1)throw Error('صيغة النسخة غير مدعومة');for(const k of ['customers','products','invoices','movements','stock','audit']){if(!Array.isArray(b[k]))throw Error('ملف غير مكتمل');const ids=new Set();for(const r of b[k]){if(!r.id||ids.has(r.id))throw Error('معرّفات مكررة');ids.add(r.id);}}if(!b.settings||typeof b.settings.factory!=='string')throw Error('إعدادات غير صالحة');for(const i of b.invoices){if(!b.customers.some(c=>c.id===i.customerId)||!['sale','return'].includes(i.type)||!['issued','draft','cancelled'].includes(i.status)||!Array.isArray(i.items)||!i.items.length)throw Error('فاتورة غير صالحة');for(const x of i.items)if(!x.name||![x.qty,x.price,x.cost].every(Number.isFinite)||x.qty<=0||x.price<0||x.cost<0)throw Error('بنود فاتورة غير صالحة');if(!Number.isFinite(i.discount)||i.discount<0||totals(i).total<0)throw Error('خصم غير صالح');}for(const m of b.movements)if(!Number.isFinite(m.amount)||m.amount<=0||!['receipt','refund','income','expense','capital','withdrawal','employee_payment','employee_repayment','employee_purchase'].includes(m.type))throw Error('حركة غير صالحة');for(const p of b.products)if(![p.opening,p.price,p.cost].every(Number.isFinite)||p.opening<0||p.price<0||p.cost<0)throw Error('منتج غير صالح');for(const c of b.customers)if(!Number.isFinite(c.opening))throw Error('رصيد غير صالح');for(const s of b.stock)if(!Number.isFinite(s.qty)||!Number.isFinite(s.unitCost)||!b.products.some(p=>p.id===s.productId))throw Error('حركة جرد غير صالحة');return b;}
function checkInvoice(b,i){if(!i.customerId||!b.customers.some(c=>c.id===i.customerId))throw Error('اختار العميل');if(!i.items.length||i.items.some(x=>!x.name||x.qty<=0||x.price<0||x.cost<0||![x.qty,x.price,x.cost].every(Number.isFinite)))throw Error('راجع اسم وكمية وسعر وتكلفة كل بند');if(i.discount<0||totals(i).total<0)throw Error('الخصم أكبر من الفاتورة');const other={...b,invoices:b.invoices.filter(x=>x.id!==i.id)};if(i.type==='return'&&i.status==='issued'){const orig=b.invoices.find(x=>x.id===i.originalId&&x.type==='sale'&&x.status==='issued');if(!orig||orig.customerId!==i.customerId)throw Error('اختار فاتورة البيع الأصلية لنفس العميل');for(const x of i.items){const original=orig.items.find(y=>y.lineId===x.sourceLineId);if(!original)throw Error('بند المرتجع غير موجود في الفاتورة الأصلية');const returned=sum(other.invoices.filter(r=>r.type==='return'&&r.originalId===orig.id&&r.status==='issued').flatMap(r=>r.items.filter(y=>y.sourceLineId===x.sourceLineId).map(y=>y.qty)));const current=sum(i.items.filter(y=>y.sourceLineId===x.sourceLineId).map(y=>y.qty));if(returned+current>original.qty)throw Error('كمية المرتجع تتجاوز الكمية المباعة');if(x.price>original.price||x.cost!==original.cost||x.productId!==original.productId)throw Error('راجع سعر وتكلفة وصنف المرتجع');}const returns=sum(other.invoices.filter(r=>r.type==='return'&&r.originalId===orig.id&&r.status==='issued').map(r=>totals(r).total));if(round(returns+totals(i).total)>totals(orig).total)throw Error('قيمة المرتجعات أكبر من صافي الفاتورة الأصلية بعد الخصم');}return i;}

function num(label,name,value=0,extra='min="0"'){return field(label,name,value,'number',`step="0.01" required ${extra}`)}

function section(title,content,action=''){return `<section class="panel"><div class="sectionhead"><h3>${title}</h3>${action}</div>${content}</section>`;}
function dates(){return `<div class="dateinputs"><label>من<input id="from" type="date" value="${from}"></label><label>إلى<input id="to" type="date" value="${to}"></label></div>`}

async function readServer(){online();state.session=await Cloud.refresh(state.session);const rows=await Cloud.remote(state.session);return rows[0]||null;}
function applyRemote(row){state.role=row?.role||'staff';if(row?.data&&state.role!=='owner'){row.data.products.forEach(p=>p.cost=0);row.data.stock.forEach(p=>p.unitCost=0);row.data.invoices.forEach(i=>i.items.forEach(x=>x.cost=0));}state.book=row?.data?validateBook(row.data):blank();state.revision=row?.revision||0;state.lastSync=new Date().toISOString();if(customerFocus&&!B().customers.some(c=>c.id===customerFocus))customerFocus=null;if(printView&&!B().invoices.some(i=>i.id===printView))printView=null;}
async function change(description,fn){
 if(busy)return;online();busy=true;renderStatus();let before;
 try{
  const row=await readServer();
  if((row?.revision||0)!==state.revision){applyRemote(row);$('#modal').close();render();throw Error('الدفتر اتعدل من جهاز تاني. تم تحميل آخر البيانات؛ افتح العملية من جديد بعد مراجعتها.');}
  before=structuredClone(B());fn(B());validateBook(B());validateEmployees(B());B().audit.push({id:uid(),time:new Date().toISOString(),user:email,action:description});
  state.revision=await Cloud.upload(state.session,state.revision,B());applyRemote(await readServer());state.lastSync=new Date().toISOString();$('#modal').close();render();toast('تم الحفظ مباشرة في قاعدة البيانات');
 }catch(e){
  if(e.message==='XLASER_CONFLICT'){if(!netBlocked)applyRemote(await readServer());$('#modal').close();render();throw Error('جهاز تاني حفظ قبلك؛ العملية لم تُحفظ. البيانات اتحدثت من الخادم، راجعها وجرّب من جديد.');}
  if(before&&!netBlocked)state.book=before;
  throw e;
 }finally{busy=false;renderStatus();}
}

function stock(){return `<div class="sectionhead"><p class="muted">الرصيد = الافتتاحي + التوريدات والتسويات − المبيعات + المرتجعات.</p><div class="flow">${button('توريد / تسوية جرد','newstock')}${button('+ منتج أو خامة','newproduct','','primary')}</div></div>${searchBar('بحث بالمنتج أو كود الصنف')}${section('رصيد الأصناف',table(['الصنف','الوحدة','المتاح','سعر البيع','إجراءات'],B().products.filter(p=>match(p.name+' '+p.sku)).map(p=>tr([`<b>${esc(p.name)}</b><br><small>${esc(p.sku)}</small>`,esc(p.unit),`<span class="${stockQty(B(),p.id)<=p.minimum?'negative':''}">${stockQty(B(),p.id)}</span>`,money(p.price),button('تعديل البيانات','editproduct',p.id)+button('تعديل العدد','editquantity',p.id)]))))}${section('توريدات وتسويات المخزون',table(['التاريخ','الصنف','الكمية',...(isOwner()?['قيمة التوريد']:[]),'البيان','إجراء'],[...B().stock].reverse().map(s=>tr([s.date,esc(B().products.find(p=>p.id===s.productId)?.name),String(s.qty)+(s.cancelled?' • ملغاة':''),...(isOwner()?[money(Math.max(0,s.qty)*s.unitCost)]:[]),esc(s.note),s.cancelled?button('استرجاع','restorestock',s.id):button('تعديل','editstock',s.id)+button('إلغاء','cancelstock',s.id,'danger')]))))}${note('توريد المخزون لا يُخصم من الربح مرة أخرى؛ التكلفة تُخصم وقت بيع المنتج. عند استهلاك خامة في شغل يدوي، سجّل تسوية استهلاك وأدخل تكلفتها في بند الفاتورة. تكلفة الجرد المعروضة تقديرية بسعر التكلفة الحالي، وليست تقييمًا محاسبيًا بمتوسط مرجّح.')}`;}
function reports(){if(!isOwner())return '';const r=report(B(),from,to);return `<div class="sectionhead">${dates()}<div class="flow">${button('طباعة / PDF','print')}${button('تصدير تقرير CSV','reportcsv')}</div></div><div class="stats">${stat('صافي المبيعات',r.sales)}${stat('تكلفة المبيعات',r.cost)}${stat('مصروفات التشغيل',r.expense)}${stat('صافي الربح',r.profit)}</div>${note('بنود بيع بدون تكلفة مسجلة: '+issued(B()).flatMap(i=>i.items.filter(x=>!x.cost)).length+' — راجع تكلفة المنتجات قبل الاعتماد على الربح. الأصناف اليدوية المحفوظة تبدأ بتكلفة صفر، ويضبطها المدير من تعديل المنتج للمبيعات التالية.')}<div class="grid2">${section('تفاصيل صافي الربح',table(['البند','القيمة'],[['صافي المبيعات',r.sales],['− تكلفة المنتجات والخدمات المباعة',-r.cost],['+ إيرادات أخرى',r.other],['− مصروفات التشغيل',-r.expense],['= صافي الربح',r.profit]].map(([l,v])=>tr([l,money(v)]))))}${section('مؤشرات منفصلة عن الربح',table(['المؤشر','القيمة'],[['تحصيلات العملاء في الفترة',r.received],['أرصدة العملاء الحالية — كل الفترات',r.debts],['تقدير قيمة المخزون الحالي',r.inventory]].map(([l,v])=>tr([l,money(v)]))))}</div>${note('الربح على أساس الفواتير المعتمدة وتكاليف بنودها، حتى لو العميل لسه ما دفعش. إضافة رأس المال والمسحوبات والتحصيلات لا تدخل في الإيرادات. المصروفات الرأسمالية مثل الماكينات تحتاج معالجة محاسبية منفصلة؛ ما تسجلهاش كمصروف تشغيل لو هتقيّم ربح الفترة بدقة.')}`;}

function settings(){if(!isOwner())return '<div class="card"><h3>حساب موظف</h3><p class="tip">التكلفة والأرباح وإدارة الصلاحيات خاصة بالمدير.</p>'+button('تسجيل خروج','lock')+'</div>';return `<div class="grid2"><section class="card settingsblock"><h3>بيانات المصنع</h3><form id="settingsform"><div class="fieldgrid">${field('اسم المصنع','factory',B().settings.factory,'text','required')}${field('موبايل المصنع','phone',B().settings.phone)}<div class="full">${field('عنوان / رقم إنستا باي لاستقبال التحويل','instapay',B().settings.instapay)}</div></div><button class="primary">حفظ مباشرة في القاعدة</button></form></section><section class="card settingsblock"><h3>اتصال مباشر بقاعدة البيانات</h3><p class="tip">كل جهاز يدخل بنفس حساب المصنع يرى نفس الدفتر. جلسة الدخول بتفضل محفوظة على الجهاز، وبيانات الحسابات تفضل على القاعدة فقط. استخدم تسجيل الخروج لإنهاء الجلسة على الجهاز.</p><p class="tip">الحسابات تتحدث تلقائيًا أثناء الاتصال.</p></section><section class="card settingsblock"><h3>صلاحيات الموظفين</h3><p class="tip">كل موظف يسجل بحساب مستقل. لا تشارك حساب المدير؛ الموظف لا يستلم التكلفة أو أرباح المصنع من الخادم.</p><div class="flow">${button('إضافة / تفعيل موظف','addstaff')}${button('إلغاء صلاحية موظف','removestaff')}</div><div class="divider"></div><h3>نسخة احتياطية اختيارية</h3><p class="tip">تنزيل نسخة JSON من بيانات الخادم فقط؛ الملف يحتوي حسابات المصنع بصيغة مقروءة، فاحفظه في مكان خاص. النسخة ليست مصدر تشغيل للنظام.</p><div class="divider"></div>${button('تنزيل نسخة من الخادم','backup','','primary')}</section><section class="card settingsblock"><h3>التقارير والطباعة</h3><p class="tip">اختار Save as PDF من نافذة الطباعة لحفظ التقرير.</p><div class="divider"></div><div class="flow">${button('تقرير الأرباح','page','reports')}${button('حسابات العملاء','page','customers')}${button('تسجيل خروج','lock')}</div><p class="tip">هتفضل متسجل دخول على الجهاز لحد ما تختار تسجيل الخروج أو الجلسة تتلغى.</p></section></div>${section('سجل التعديلات',table(['الوقت','المستخدم','الإجراء'],[...B().audit].reverse().slice(0,150).map(a=>tr([new Date(a.time).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'}),esc(a.user),'<span class="audit">'+esc(a.action)+'</span>']))))}`;}

function invoicePrint(id){const i=B().invoices.find(x=>x.id===id),c=B().customers.find(c=>c.id===i.customerId);const paid=sum(active(B()).filter(m=>m.invoiceId===id).map(m=>(m.type==='refund'?-1:1)*m.amount));return `<div class="screenonly sectionhead"><h2>${esc(B().settings.factory)} — ${i.type==='return'?'مرتجع':'فاتورة بيع'}</h2><div class="flow">${button('رجوع','closeprint')}${button('تعديل','editinvoice',id)}${button('طباعة / حفظ PDF','print','','primary')}${i.status==='issued'&&i.type==='sale'?button('تسجيل تحصيل','payinvoice',id):''}</div></div><div class="panel card"><div class="sectionhead"><div><h2>${esc(i.number)}</h2><p class="muted">${i.date} • ${statuses[i.status]} • ${i.type==='return'?'مرتجع مبيعات':'فاتورة بيع'}</p></div><div><h3>${esc(c.name)}</h3><p class="muted">${esc(c.phone)}</p></div></div><div class="divider"></div>${table(['الصنف / الخدمة','الكمية','سعر الوحدة','الإجمالي'],i.items.map(x=>tr([esc(x.name),x.qty,money(x.price),money(round(x.qty*x.price))])))}<div class="divider"></div>${table(['البيان','القيمة'],[['إجمالي البنود',totals(i).gross],['خصم',i.discount],['صافي الفاتورة',totals(i).total],['المدفوع لهذه الفاتورة',i.type==='return'?-paid:paid],...(i.type==='sale'?[['الباقي على الفاتورة',invoicePaymentInfo(B(),i).remaining]]:[]),['رصيد العميل الإجمالي الحالي',balance(B(),c.id)]].map(([l,v])=>tr([l,money(v)])))}<p class="tip">${esc(i.note)}</p><p class="tip">بيانات التحويل عند الحاجة: ${esc(B().settings.instapay||'لم يتم تسجيل عنوان التحويل')}</p><p class="tip">رصيد العميل يشمل كل فواتيره ودفعاته. الدفعات غير المرتبطة بفاتورة تظهر في كشف حساب العميل.</p></div>`;}
function modal(title,body,onSubmit){const d=$('#modal');d.innerHTML=`<form id="modalform"><div class="sectionhead"><h2>${title}</h2>${button('×','closemodal')}</div>${body}<div id="formerr" class="err"></div><div class="actions">${button('إلغاء','closemodal')}<button type="submit" class="primary">حفظ</button></div></form>`;d.showModal();$('#modalform').onsubmit=async e=>{e.preventDefault();if(busy){$('#formerr').textContent='انتظر انتهاء المزامنة';return;}const btn=e.submitter;if(btn)btn.disabled=true;try{await onSubmit(new FormData(e.currentTarget),e.currentTarget);}catch(err){if($('#formerr'))$('#formerr').textContent=err.message;else toast(err.message);}finally{if(btn)btn.disabled=false;}};}
function customerForm(id){const c=B().customers.find(c=>c.id===id)||{id:uid(),name:'',phone:'',opening:0,openingDate:today(),note:''};modal(id?'تعديل العميل':'عميل جديد',`<div class="fieldgrid">${field('اسم العميل','name',c.name,'text','required')}${field('رقم الموبايل','phone',c.phone)}${num('الرصيد الافتتاحي — السالب لصالح العميل','opening',c.opening,'')}${field('تاريخ الرصيد الافتتاحي','openingDate',c.openingDate,'date','required')}<label class="full">ملاحظات<textarea name="note">${esc(c.note)}</textarea></label></div>`,f=>change('حفظ العميل '+f.get('name'),b=>{const n={...c,name:String(f.get('name')).trim(),phone:String(f.get('phone')).trim(),opening:round(f.get('opening')),openingDate:String(f.get('openingDate')),note:String(f.get('note'))};if(!n.name)throw Error('اكتب اسم العميل');const idx=b.customers.findIndex(x=>x.id===c.id);idx<0?b.customers.push(n):b.customers[idx]=n;}));}
function productForm(id){const p=B().products.find(x=>x.id===id)||{id:uid(),name:'',sku:'',unit:'قطعة',opening:0,price:0,cost:0,minimum:0};modal(id?'تعديل الصنف':'منتج أو خامة جديدة',`<div class="fieldgrid">${field('اسم المنتج / الخامة','name',p.name,'text','required')}${field('كود الصنف','sku',p.sku)}${field('الوحدة','unit',p.unit,'text','required')}${num('كمية افتتاحية','opening',p.opening)}${num('سعر البيع الافتراضي','price',p.price)}${isOwner()?num('تكلفة الوحدة — خاصة بالمدير','cost',p.cost):'<input type="hidden" name="cost" value="0">'}${num('تنبيه عند كمية','minimum',p.minimum)}</div>${note('تغيير التكلفة الحالية لا يغيّر تكلفة الفواتير السابقة. لتسجيل شراء مخزون استخدم «توريد / تسوية جرد».')}`,f=>change('حفظ الصنف '+f.get('name'),b=>{const n={...p,name:String(f.get('name')).trim(),sku:String(f.get('sku')),unit:String(f.get('unit')),opening:Number(f.get('opening')),price:round(f.get('price')),cost:round(f.get('cost')),minimum:Number(f.get('minimum'))};if(!n.name)throw Error('اكتب اسم الصنف');const idx=b.products.findIndex(x=>x.id===p.id);idx<0?b.products.push(n):b.products[idx]=n;}));}
function setStockQuantity(b,productId,target,date,reason){
 const p=b.products.find(p=>p.id===productId);if(!p)throw Error('الصنف غير موجود');
 if(!Number.isFinite(target)||!String(reason).trim()||!date)throw Error('راجع الكمية والتاريخ واكتب سبب التعديل');
 const before=stockQty(b,productId),delta=round(target-before);
 if(!delta)throw Error('الكمية الجديدة هي نفس الكمية الحالية');
 b.stock.push({id:uid(),productId,qty:delta,unitCost:p.cost||0,date,kind:'adjust',note:String(reason).trim(),reference:'',countBefore:before,countAfter:target});
}
function quantityForm(id){const p=B().products.find(p=>p.id===id);if(!p)return;
 modal('تعديل الكمية الحالية — '+p.name,`<p>الرصيد الحالي: <b>${stockQty(B(),id)}</b> ${esc(p.unit)}</p><div class="fieldgrid">${num('الكمية الفعلية الجديدة','target',stockQty(B(),id),'required')}${field('تاريخ الجرد','date',today(),'date','required')}<label class="full">سبب التعديل<textarea name="reason" required></textarea></label></div>${note('اكتب العدد الموجود فعلًا. فرق العدد يُسجل كتسوية جرد، وتظل الفواتير السابقة كما هي.')}`,f=>change('تعديل كمية '+p.name,b=>setStockQuantity(b,id,Number(f.get('target')),String(f.get('date')),String(f.get('reason')))));
}
function stockForm(id){if(!B().products.length){toast('أضف منتج أو خامة الأول');return;}
 const old=B().stock.find(s=>s.id===id);if(id&&(!old||old.cancelled)){toast('استرجع الحركة الملغاة قبل تعديلها');return;}
 const m=old||{id:uid(),productId:B().products[0].id,kind:'supply',date:today(),qty:1,unitCost:0,reference:'',note:''};
 modal(id?'تعديل حركة جرد':'توريد أو تسوية جرد',`<div class="fieldgrid"><label>الصنف<select name="productId">${options(B().products,m.productId)}</select></label><label>نوع الحركة<select name="kind"><option value="supply" ${m.kind==='supply'?'selected':''}>توريد مخزون</option><option value="adjust" ${m.kind==='adjust'?'selected':''}>تسوية كمية / استهلاك</option></select></label>${field('التاريخ','date',m.date,'date','required')}${num('كمية الحركة — تسوية النقص بالسالب','qty',m.qty,'required')}${isOwner()?num('تكلفة الوحدة — خاصة بالمدير','unitCost',m.unitCost):'<input type="hidden" name="unitCost" value="0">'}${field('مرجع التحويل / الشراء','reference',m.reference)}<label class="full">البيان<textarea name="note" required>${esc(m.note)}</textarea></label>${isOwner()?`<label class="full"><span><input type="checkbox" name="updateCost" ${id?'':'checked'}> اعتماد هذه التكلفة كتكلفة الوحدة الحالية للصنف</span></label>`:''}</div>${note('التعديل يعيد حساب الرصيد الحالي دون تغيير تكلفة الفواتير السابقة. كمية الحركة هي الزيادة أو النقص، وليست العدد النهائي الموجود.')}`,f=>change('حركة جرد: '+f.get('note'),b=>{
 const p=b.products.find(p=>p.id===f.get('productId'));const qty=Number(f.get('qty')),unitCost=round(f.get('unitCost')),kind=String(f.get('kind'));
 if(!p||!qty||!Number.isFinite(qty)||!Number.isFinite(unitCost)||unitCost<0||!String(f.get('note')).trim())throw Error('راجع الصنف والكمية والتكلفة والبيان');
 if(kind==='supply'&&qty<=0)throw Error('التوريد لازم تكون كميته موجبة');
 const n={...m,productId:p.id,qty,unitCost,date:String(f.get('date')),note:String(f.get('note')).trim(),reference:String(f.get('reference')),kind};
 delete n.countBefore;delete n.countAfter;
 const idx=b.stock.findIndex(s=>s.id===m.id);if(idx<0)b.stock.push(n);else b.stock[idx]=n;
 if(isOwner()&&kind==='supply'&&f.get('updateCost'))p.cost=unitCost;
 }));}
function movementForm(id,type='receipt',customerId='',invoiceId=''){const m=B().movements.find(x=>x.id===id)||{id:uid(),type,customerId,invoiceId,date:today(),amount:0,note:'',reference:''};modal(id?'تعديل حركة':'تسجيل حركة مالية',`<div class="fieldgrid"><label>نوع الحركة<select name="type">${Object.entries(types).filter(([k])=>!k.startsWith('employee_')).map(([k,v])=>`<option value="${k}" ${m.type===k?'selected':''}>${v}</option>`).join('')}</select></label>${field('التاريخ','date',m.date,'date','required')}<label>العميل — للتحصيل / رد المبلغ<select name="customerId"><option value="">بدون عميل</option>${options(B().customers.filter(c=>!c.invoiceOnly||c.id===m.customerId),m.customerId)}</select></label><label>الفاتورة المرتبطة — اختياري<select name="invoiceId"><option value="">غير مرتبطة بفاتورة</option>${options(issued(B()),m.invoiceId,'number')}</select></label>${num('المبلغ المدفوع','amount',m.amount,'min="0.01"')}${field('مرجع تحويل إنستا باي','reference',m.reference)}<label class="full">البيان<textarea name="note" required>${esc(m.note)}</textarea></label></div>`,f=>change('حركة '+types[f.get('type')]+' '+f.get('note'),b=>{const n={...m,type:String(f.get('type')),date:String(f.get('date')),amount:round(f.get('amount')),customerId:String(f.get('customerId')),invoiceId:String(f.get('invoiceId')),reference:String(f.get('reference')),note:String(f.get('note'))};if(['receipt','refund'].includes(n.type)){if(!b.customers.some(c=>c.id===n.customerId))throw Error('اختار العميل');if(n.invoiceId){const inv=b.invoices.find(i=>i.id===n.invoiceId);if(!inv||inv.status!=='issued'||inv.customerId!==n.customerId)throw Error('الفاتورة لا تخص العميل أو غير معتمدة');if((n.type==='receipt'&&inv.type!=='sale')||(n.type==='refund'&&inv.type!=='return'))throw Error('التحصيل يرتبط بفاتورة بيع، ورد المبلغ بفاتورة مرتجع');}}else{n.customerId='';n.invoiceId='';}const idx=b.movements.findIndex(x=>x.id===m.id);idx<0?b.movements.push(n):b.movements[idx]=n;}));}
function invoicePaymentInfo(b,i){const paid=sum(active(b).filter(m=>m.invoiceId===i.id&&m.type==='receipt').map(m=>m.amount));const total=totals(i).total;return {paid,remaining:Math.max(0,round(total-paid)),mode:paid>=total?'paid':paid>0?'partial':'credit',label:paid>=total?'مدفوع بالكامل':paid>0?'مدفوع جزئيًا':'آجل / على الحساب'};}
function invoiceDesiredPaid(i,mode,amount){if(i.status!=='issued'||i.type!=='sale')return 0;const total=totals(i).total;if(mode==='paid')return total;if(mode==='credit')return 0;const paid=round(amount);if(mode!=='partial'||!Number.isFinite(paid)||paid<=0||paid>=total)throw Error('المبلغ الجزئي لازم يكون أكبر من صفر وأقل من إجمالي الفاتورة');return paid;}
function prepareWalkIn(b,i,name,phone,paid){const existing=b.customers.find(c=>c.id===i.customerId);if(i.customerId!=='__walkin__')return;if(i.type!=='sale')throw Error('المرتجع لازم يرتبط بعميل فاتورة الأصل');const balanceDue=i.status==='issued'&&paid<totals(i).total;name=String(name||'').trim();if(balanceDue&&(!name||name==='عميل طياري'))throw Error('اكتب اسم العميل علشان نسجل الباقي عليه');const id=i.walkInCustomerId||'walkin-'+i.id;const old=b.customers.find(c=>c.id===id);const c={...(old||{}),id,name:name||'عميل طياري',phone:String(phone||'').trim(),opening:0,openingDate:i.date,note:old?.note||'',walkIn:true,invoiceOnly:old?.invoiceOnly===false?false:!balanceDue};const index=b.customers.findIndex(c=>c.id===id);index<0?b.customers.push(c):b.customers[index]=c;i.customerId=id;i.walkInCustomerId=id;}
function settleInvoice(b,i,desired){if(i.type!=='sale')return;const external=sum(active(b).filter(m=>m.invoiceId===i.id&&m.type==='receipt'&&!m.invoiceSettlement).map(m=>m.amount));if(desired<external)throw Error('في دفعات مستقلة مسجلة للفاتورة؛ عدّلها من الحركات قبل تخفيض المدفوع');let auto=b.movements.find(m=>m.invoiceId===i.id&&m.invoiceSettlement);const amount=round(desired-external);if(amount>0){const movement={id:auto?.id||'invoice-payment-'+i.id,type:'receipt',customerId:i.customerId,invoiceId:i.id,date:i.date,amount,reference:'',note:'مدفوع مع الفاتورة '+i.number,invoiceSettlement:true,cancelled:false};if(auto)Object.assign(auto,movement);else b.movements.push(movement);}else if(auto)auto.cancelled=true;i.paymentMode=desired>=totals(i).total?'paid':desired>0?'partial':'credit';}

function invoiceForm(id,isReturn=false){let inv=structuredClone(B().invoices.find(i=>i.id===id)||{id:uid(),number:(isReturn?'RET':'XL')+'-'+today().replaceAll('-','')+'-'+uid().slice(0,6).toUpperCase(),date:today(),customerId:'__walkin__',type:isReturn?'return':'sale',status:'issued',items:[],discount:0,note:'',originalId:''});if(inv.status==='cancelled'){toast('الفاتورة ملغاة؛ أنشئ فاتورة جديدة للحفاظ على السجل');return;}if(B().invoices.some(r=>r.originalId===id&&r.status==='issued')){toast('الفاتورة لها مرتجعات معتمدة؛ ألغِ المرتجعات أولًا قبل تعديل الأصل');return;}isReturn=inv.type==='return';const currentCustomer=B().customers.find(c=>c.id===inv.customerId),walkIn=inv.customerId==='__walkin__'||currentCustomer?.walkIn;const payment=invoicePaymentInfo(B(),inv),initialPayment=id?payment.mode:'paid';let lines=inv.items.length?inv.items:[{lineId:uid(),name:'',qty:1,price:0,cost:0,productId:''}];
modal(isReturn?'فاتورة مرتجع':'فاتورة بيع',`<div class="fieldgrid">${field('رقم الفاتورة','number',inv.number,'text','required')}${field('التاريخ','date',inv.date,'date','required')}<label>العميل<select name="customerId" id="invoicecustomer">${isReturn?'':`<option value="__walkin__" ${walkIn?'selected':''}>عميل طياري — بدون تسجيل عميل</option>`}${options(B().customers.filter(c=>!c.invoiceOnly),walkIn?'':inv.customerId)}</select></label><label>حالة الفاتورة<select name="status"><option value="issued" ${inv.status==='issued'?'selected':''}>معتمدة — تدخل الحسابات والجرد</option><option value="draft" ${inv.status==='draft'?'selected':''}>مسودة — خارج الحسابات</option></select></label>${isReturn?`<label class="full">فاتورة البيع الأصلية<select name="originalId" id="returnoriginal"><option value="">اختار الأصل</option>${options(issued(B()).filter(i=>i.type==='sale'),inv.originalId,'number')}</select></label>`:''}</div>${isReturn?'':`<div id="walkinfields" class="fieldgrid" ${walkIn?'':'hidden'}>${field('اسم العميل — اختياري للمدفوع وإلزامي للآجل','walkinName',currentCustomer?.walkIn&&currentCustomer.name!=='عميل طياري'?currentCustomer.name:'')}${field('رقم الموبايل — اختياري','walkinPhone',currentCustomer?.walkIn?currentCustomer.phone:'')}</div><div class="fieldgrid"><label>حالة الدفع<select name="paymentMode" id="invoicepayment"><option value="paid" ${initialPayment==='paid'?'selected':''}>مدفوع بالكامل</option><option value="partial" ${initialPayment==='partial'?'selected':''}>دفع جزء والباقي على الحساب</option><option value="credit" ${initialPayment==='credit'?'selected':''}>آجل / على الحساب</option></select></label><div id="partialpayment" ${initialPayment==='partial'?'':'hidden'}>${num('المبلغ المدفوع','paidAmount',payment.paid,'min="0"')}</div></div>`}<div class="sectionhead"><h3>بنود الفاتورة</h3>${isReturn?'':button('+ بند يدوي','addline')+`<select id="addproduct" aria-label="إضافة منتج جاهز"><option value="">+ اختار منتج جاهز</option>${options(B().products)}</select>`}</div><p class="tip">الكميات أعداد صحيحة. التكلفة تُؤخذ داخليًا من المنتج ولا تظهر في الفاتورة. البيع مسموح حتى لو الكمية غير متوفرة.</p><div id="lines"></div><div class="fieldgrid">${field('خصم الفاتورة','discount',inv.discount,'number','min="0" step="1" required')}<div class="totals"><span>الصافي</span><b id="invoicetotal"></b></div><label class="full">ملاحظات الفاتورة<textarea name="note">${esc(inv.note)}</textarea></label></div>${note(isReturn?'حدّد فاتورة الأصل. المرتجع يرجع المخزون ويخصم المبيعات والتكلفة. رد الفلوس نفسه يُسجل كحركة مستقلة.':'اختار حالة الدفع؛ المدفوع يتسجل مع الفاتورة مباشرة بدون تحديد طريقة دفع. المسودة لا تسجّل دفعات.')}`,async(f)=>{const candidate={...inv,number:String(f.get('number')).trim(),date:String(f.get('date')),customerId:String(f.get('customerId')),status:String(f.get('status')),originalId:String(f.get('originalId')||''),discount:round(f.get('discount')),note:String(f.get('note')),items:lines.map(x=>({...x,qty:Number(x.qty),price:round(x.price),cost:round(x.cost)}))};await change('حفظ فاتورة '+candidate.number+' بقيمة '+totals(candidate).total+(id?' (قبل التعديل '+totals(inv).total+')':''),b=>{const desired=invoiceDesiredPaid(candidate,String(f.get('paymentMode')||'credit'),f.get('paidAmount'));prepareWalkIn(b,candidate,f.get('walkinName'),f.get('walkinPhone'),desired);if(b.invoices.some(i=>i.id!==candidate.id&&i.number===candidate.number))throw Error('رقم الفاتورة مستخدم بالفعل');const linked=active(b).some(m=>m.invoiceId===candidate.id&&!m.invoiceSettlement);if(linked&&(inv.customerId!==candidate.customerId||candidate.status!=='issued'))throw Error('الفاتورة لها تحويلات؛ لا تغيّر العميل أو ترجعها مسودة قبل إلغاء التحويلات');if(!Number.isInteger(candidate.discount))throw Error('خصم الفاتورة لازم يكون عدد صحيح');for(const x of candidate.items){if(!Number.isInteger(x.price))throw Error('سعر بند الفاتورة لازم يكون عدد صحيح');if(!Number.isInteger(x.qty))throw Error('كمية كل بند لازم تكون عدد صحيح');if(x.saveProduct&&!x.productId){let p=b.products.find(p=>p.name.trim().toLowerCase()===x.name.trim().toLowerCase());if(!p){p={id:uid(),name:x.name.trim(),sku:'',unit:'قطعة',opening:0,price:x.price,cost:0,minimum:0};b.products.push(p);}x.productId=p.id;x.cost=p.cost;}delete x.saveProduct;}checkInvoice(b,candidate);const idx=b.invoices.findIndex(x=>x.id===candidate.id);idx<0?b.invoices.push(candidate):b.invoices[idx]=candidate;settleInvoice(b,candidate,desired);});});
$('#invoicecustomer')?.addEventListener('change',e=>{$('#walkinfields').hidden=e.target.value!=='__walkin__';});$('#invoicepayment')?.addEventListener('change',e=>{$('#partialpayment').hidden=e.target.value!=='partial';});
function redraw(){const container=$('#lines');container.innerHTML=lines.map((x,n)=>`<div class="line" data-line="${n}"><div><label>الصنف / الخدمة<input value="${esc(x.name)}" data-key="name" required ${isReturn?'readonly':''}></label>${!x.productId&&!isReturn?`<label class="inlinecheck tiny"><input type="checkbox" data-key="saveProduct" ${x.saveProduct?'checked':''}>إضافة للمنتجات</label>`:''}</div><label>الكمية<input value="${x.qty}" data-key="qty" type="number" min="1" step="1" required></label><label>سعر الوحدة<input value="${x.price}" data-key="price" type="number" min="0" step="1" required ${isReturn?'readonly':''}></label>${button('×','removeline',String(n))}</div>`).join('');updateTotal();}
function updateTotal(){$('#invoicetotal').innerHTML=money(totals({items:lines,discount:Number($('#modalform [name=discount]').value)}).total)}
$('#modalform').addEventListener('input',e=>{const row=e.target.closest('[data-line]');if(row){const x=lines[Number(row.dataset.line)];x[e.target.dataset.key]=e.target.dataset.key==='saveProduct'?e.target.checked:e.target.dataset.key==='name'?e.target.value:Number(e.target.value);}updateTotal();});
$('#modalform').addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a?.dataset.action==='addline'){lines.push({lineId:uid(),name:'',qty:1,price:0,cost:0,productId:''});redraw();}if(a?.dataset.action==='removeline'){lines.splice(Number(a.dataset.id),1);redraw();}});
$('#addproduct')?.addEventListener('change',e=>{const p=B().products.find(p=>p.id===e.target.value);if(p){lines.push({lineId:uid(),productId:p.id,name:p.name,qty:1,price:p.price,cost:p.cost});if(lines.length>1&&!lines[0].name)lines.shift();redraw();}e.target.value='';});
$('#returnoriginal')?.addEventListener('change',e=>{const orig=B().invoices.find(i=>i.id===e.target.value);if(!orig){lines=[];redraw();return;}$('#modalform [name=customerId]').value=orig.customerId;lines=orig.items.map(x=>{const used=sum(B().invoices.filter(r=>r.id!==id&&r.type==='return'&&r.status==='issued'&&r.originalId===orig.id).flatMap(r=>r.items.filter(y=>y.sourceLineId===x.lineId).map(y=>y.qty)));return {...x,lineId:uid(),sourceLineId:x.lineId,qty:round(x.qty-used)};}).filter(x=>x.qty>0);const gross=totals({items:lines,discount:0}).gross;$('#modalform [name=discount]').value=totals(orig).gross?round(gross*orig.discount/totals(orig).gross):0;redraw();});redraw();}
async function cancelInvoice(id){const i=B().invoices.find(i=>i.id===id);if(!confirm('إلغاء الفاتورة '+i.number+'؟ هتخرج من الحسابات والجرد مع بقاء سجلها.'))return;await change('إلغاء فاتورة '+i.number,b=>{if(active(b).some(m=>m.invoiceId===id&&!m.invoiceSettlement))throw Error('ألغِ الدفعات المستقلة المرتبطة بالفاتورة الأول أو عدّل ربطها');if(b.invoices.some(r=>r.originalId===id&&r.status==='issued'))throw Error('ألغِ المرتجعات المرتبطة أولًا');i.status='cancelled';for(const m of b.movements)if(m.invoiceId===id&&m.invoiceSettlement)m.cancelled=true;});}
function download(name,content,mime='application/json'){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}

async function backup(){if(!isOwner())throw Error('للمدير فقط');online();if(busy)return;busy=true;try{const row=await readServer();download('X-Laser-Server-'+today()+'.json',JSON.stringify({format:'xlaser-server-backup-v2',savedAt:new Date().toISOString(),owner:state.owner,revision:row?.revision||0,book:row?.data||blank()},null,2));toast('تم تنزيل نسخة من قاعدة البيانات');}finally{busy=false;}}

function csv(name,rows){download(name,'\ufeff'+rows.map(r=>r.map(v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}).join(',')).join('\r\n'),'text/csv;charset=utf-8');}


function signupStaff(){modal('تسجيل حساب موظف',`<p class="tip">تسجيل الحساب لا يمنح دخولًا للمصنع. المدير لازم يضيف بريدك من إعداداته بعد التسجيل.</p><div class="fieldgrid">${field('البريد الإلكتروني','email','','email','required')}${field('كلمة مرور 10 حروف على الأقل','password','','password','required minlength="10"')}</div>`,async f=>{await Cloud.signup(String(f.get('email')).trim(),String(f.get('password')));$('#modal').close();toast('الحساب اتسجل؛ اطلب من المدير تفعيل بريدك من إعدادات الصلاحيات.');});}
function staffForm(remove=false){if(!isOwner())return;modal(remove?'إلغاء صلاحية موظف':'إضافة وتفعيل موظف',`${field('بريد الموظف المسجل','email','','email','required')}<p class="tip">${remove?'سيتم إيقاف دخوله للدفتر على الخادم.':'الموظف يسجل من شاشة الدخول أولًا. التفعيل يسمح له بالعمل بدون إظهار التكلفة أو الربح.'}</p>`,async f=>{await Cloud.api('/rest/v1/rpc/xlaser_staff',{method:'POST',token:state.session.access_token,body:{p_email:String(f.get('email')),p_remove:remove}});$('#modal').close();toast('تم تحديث الصلاحية');});}
async function customerLink(id,rotate=false,revoke=false){if(!isOwner())return;online();const token=await Cloud.api('/rest/v1/rpc/xlaser_manage_link',{method:'POST',token:state.session.access_token,body:{p_customer:id,p_rotate:rotate,p_revoke:revoke}});if(revoke){$('#modal').close();toast('تم إلغاء الرابط؛ العميل لن يستطيع فتحه');return;}const url=PORTAL+'#token='+token;const c=B().customers.find(c=>c.id===id);const d=$('#modal');d.innerHTML=`<div class="sectionhead"><h2>لينك حساب ${esc(c.name)}</h2>${button('×','closemodal')}</div><p class="tip">الرابط يعرض حساب العميل وفواتيره فقط، ولا يعرض التكلفة أو الربح. أي شخص معاه الرابط يقدر يقرأ الحساب، فابعته للعميل فقط.</p><label>رابط العميل<input id="customerurl" dir="ltr" readonly value="${esc(url)}"></label><div class="actions">${button('نسخ الرابط','copycustomerurl')}${button('تغيير الرابط','rotatelink',id)}${button('إلغاء الرابط','revokelink',id,'danger')}</div>`;if(!d.open)d.showModal();}

function quickForm(kind,dialog=false){const expense=kind==='expense';return `<form class="quickform" data-kind="${kind}"><h3>${expense?'− مصروف سريع':'+ إيراد / تحصيل سريع'}</h3><div class="fieldgrid">${num('المبلغ بالجنيه','amount','','min="0.01"')}${field('البيان','note','','text','required maxlength="250" placeholder="'+(expense?'كهرباء، صيانة، أجور…':'سبب الإيراد أو بيان التحصيل')+'"')}${expense?'':`<label>نوع الوارد<select name="type" required><option value="">اختار النوع</option><option value="receipt">تحصيل من عميل — مش إيراد جديد</option><option value="income">إيراد آخر غير مسجل بفاتورة</option><option value="capital">إضافة رأس مال</option></select></label><label class="quickcustomer" hidden>العميل<select name="customerId"><option value="">اختار العميل</option>${options(B().customers.filter(c=>!c.invoiceOnly))}</select></label>`}</div><details><summary>تغيير التاريخ أو إضافة مرجع التحويل</summary><div class="fieldgrid">${field('التاريخ','date',today(),'date','required')}${field('مرجع إنستا باي — اختياري','reference')}</div></details><p class="tip">${expense?'البيان والمبلغ بس، والتاريخ النهارده تلقائي.':'اختار تحصيل لو المبلغ مقابل فاتورة موجودة، عشان ما يتحسبش إيراد مرتين.'}</p><div class="flow"><button class="primary" type="submit">${expense?'حفظ المصروف':'حفظ الوارد'}</button>${dialog?button('إلغاء','closemodal'):''}</div><div class="quickerror err"></div></form>`;}
function bindQuickForms(){for(const f of $$('.quickform')){const select=f.querySelector('[name=type]');select?.addEventListener('change',()=>{const row=f.querySelector('.quickcustomer'),customer=f.querySelector('[name=customerId]');row.hidden=select.value!=='receipt';customer.required=select.value==='receipt';});f.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const data=new FormData(f),type=f.dataset.kind==='expense'?'expense':String(data.get('type')),amount=round(data.get('amount')),note=String(data.get('note')).trim(),customerId=type==='receipt'?String(data.get('customerId')||''):'';const error=f.querySelector('.quickerror');error.textContent='';const btn=e.submitter||f.querySelector('button[type=submit]');btn.disabled=true;try{if(!['expense','receipt','income','capital'].includes(type)||!Number.isFinite(amount)||amount<=0||!note)throw Error('راجع البيان والمبلغ ونوع الحركة');if(type==='receipt'&&!B().customers.some(c=>c.id===customerId))throw Error('اختار العميل');await change(types[type]+' • '+note,b=>b.movements.push({id:uid(),type,date:String(data.get('date')||today()),amount,note,reference:String(data.get('reference')||''),customerId,invoiceId:''}));}catch(err){if(error.isConnected)error.textContent=err.message;else toast(err.message);}finally{btn.disabled=false;}});f.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();f.requestSubmit();}});}}
function quickModal(kind){const d=$('#modal');d.innerHTML=`<div class="sectionhead"><h2>${kind==='expense'?'تسجيل مصروف':'تسجيل وارد'}</h2>${button('×','closemodal')}</div>`+quickForm(kind,true);d.showModal();bindQuickForms();}
function capitalValues(b){const assets=(b.capitalAssets||[]).filter(a=>!a.removed);const inventory=sum(b.products.map(p=>Math.max(0,stockQty(b,p.id))*Number(p.cost||0)));const fixed=sum(assets.map(a=>a.qty*a.unitValue));const contributed=sum(active(b).filter(m=>m.type==='capital').map(m=>m.amount));const withdrawn=sum(active(b).filter(m=>m.type==='withdrawal').map(m=>m.amount));return {assets,inventory,fixed,total:round(inventory+fixed),contributed,withdrawn};}
function capital(){if(!isOwner())return '';const v=capitalValues(B());return `<div class="sectionhead"><p class="muted">جرد الخامات والمنتجات والماكينات وتجهيزات المصنع، بقيمتها المسجلة.</p><div class="flow">${button('+ إضافة موجود للمكان','newasset','','primary')}${button('طباعة / PDF','print')}</div></div><div class="stats">${stat('رأس مال المكان — قيمة الجرد',v.total,'مخزون متاح + ماكينات وتجهيزات')}${stat('قيمة المخزون المتاح',v.inventory,'بسعر التكلفة الحالي • العجز لا يُحسب أصلًا')}${stat('قيمة الماكينات والتجهيزات',v.fixed,'القيمة التي تسجلها لكل قطعة')}${stat('صافي رأس المال المدفوع',round(v.contributed-v.withdrawn),'إضافات رأس المال − مسحوبات المالك')}</div>${section('ماكينات ومعدات وأثاث المكان',table(['الموجود','التصنيف','الكمية','قيمة الوحدة','الإجمالي','إجراءات'],v.assets.map(a=>tr([esc(a.name),esc(a.category),a.qty,money(a.unitValue),money(round(a.qty*a.unitValue)),button('تعديل','editasset',a.id)+button('إزالة من الجرد','removeasset',a.id,'danger')])),'أضف الماكينات والأجهزة والأثاث، وحدد كمية وقيمة كل بند.'))}${section('جرد الخامات والمنتجات',table(['الصنف','الرصيد','تكلفة الوحدة','قيمة المتاح','إجراءات'],B().products.map(p=>tr([esc(p.name),stockQty(B(),p.id),money(p.cost),money(Math.max(0,stockQty(B(),p.id))*p.cost),button('تعديل البيانات','editproduct',p.id)+button('تعديل العدد','editquantity',p.id)]))))}${note('قيمة الجرد تقدير للموجودات المسجلة فقط، وليست رصيد إنستا باي أو صافي حقوق الملكية. لا تشمل مديونيات العملاء أو الموردين، ولا تُضاف إليها مبالغ رأس المال المدفوعة مرة ثانية. إضافة ماكينة هنا لا تسجل مصروفًا ولا تخصم من الربح.')}`;}
function assetForm(id){if(!isOwner())return;const a=(B().capitalAssets||[]).find(a=>a.id===id)||{id:uid(),name:'',category:'ماكينات',qty:1,unitValue:0,note:''};modal(id?'تعديل موجود':'إضافة موجود لجرد المكان',`<div class="fieldgrid">${field('اسم الماكينة / الجهاز / الموجود','name',a.name,'text','required')}<label>التصنيف<select name="category">${['ماكينات','أجهزة ومعدات','أثاث وتجهيزات','أخرى'].map(c=>`<option ${c===a.category?'selected':''}>${c}</option>`).join('')}</select></label>${field('الكمية','qty',a.qty,'number','min="1" step="1" required')}${num('قيمة الوحدة الحالية بالجنيه','unitValue',a.unitValue)}<label class="full">ملاحظة<textarea name="note">${esc(a.note)}</textarea></label></div>`,f=>change('جرد المكان: '+f.get('name'),b=>{const n={...a,name:String(f.get('name')).trim(),category:String(f.get('category')),qty:Number(f.get('qty')),unitValue:round(f.get('unitValue')),note:String(f.get('note'))};if(!n.name||!Number.isInteger(n.qty)||n.qty<1||!Number.isFinite(n.unitValue)||n.unitValue<0)throw Error('راجع الاسم والكمية والقيمة');b.capitalAssets||=[];const idx=b.capitalAssets.findIndex(x=>x.id===n.id);idx<0?b.capitalAssets.push(n):b.capitalAssets[idx]=n;}));}

const employeeKinds={purchase:'شراء خامات / أصل دفعه من جيبه',expense:'مصروف شغل دفعه من جيبه',due:'مستحق له — أجر / مكافأة',payment:'صرف له من المكان — تصفية / سلفة',returned:'فلوس رجّعها للمكان'};
function employeeSign(type){return type==='payment'?-1:1;}
function employeeBalance(b,id){return round(Number((b.employees||[]).find(e=>e.id===id)?.opening||0)+sum((b.employeeEntries||[]).filter(e=>e.employeeId===id&&!e.cancelled).map(e=>employeeSign(e.type)*e.amount)));}
function employeeLedger(b,id){const person=(b.employees||[]).find(e=>e.id===id);const rows=[{id:'opening',date:person.openingDate||'0000-01-01',type:'افتتاحي',note:'حساب قديم مع المكان',credit:Math.max(0,person.opening),debit:Math.max(0,-person.opening),reference:''},...(b.employeeEntries||[]).filter(e=>e.employeeId===id&&!e.cancelled).map(e=>({...e,type:employeeKinds[e.type],credit:employeeSign(e.type)>0?e.amount:0,debit:employeeSign(e.type)<0?e.amount:0}))];rows.sort((a,b)=>a.date.localeCompare(b.date));let balance=0;return rows.map(r=>({...r,balance:balance=round(balance+r.credit-r.debit)}));}
function recordEmployeeEntry(b,entry){if(!(b.employees||[]).some(e=>e.id===entry.employeeId))throw Error('اختار الموظف');if(!Object.hasOwn(employeeKinds,entry.type)||!Number.isFinite(entry.amount)||entry.amount<=0||!entry.note.trim())throw Error('راجع نوع الحركة والمبلغ والبيان');b.employeeEntries||=[];const idx=b.employeeEntries.findIndex(e=>e.id===entry.id);if(idx<0)b.employeeEntries.push(entry);else b.employeeEntries[idx]=entry;const person=b.employees.find(e=>e.id===entry.employeeId);const type=['expense','due'].includes(entry.type)?'expense':entry.type==='payment'?'employee_payment':entry.type==='purchase'?'employee_purchase':'employee_repayment';const movement={id:'employee-movement-'+entry.id,type,date:entry.date,amount:entry.amount,note:employeeKinds[entry.type]+' • '+person.name+' • '+entry.note,reference:entry.reference||'',customerId:'',invoiceId:'',employeeId:entry.employeeId,employeeEntryId:entry.id,employeeLedger:true,paidByEmployee:['expense','purchase'].includes(entry.type),accruedEmployeeDue:entry.type==='due',cancelled:!!entry.cancelled};const mi=b.movements.findIndex(m=>m.id===movement.id);if(mi<0)b.movements.push(movement);else b.movements[mi]=movement;}
function validateEmployees(b){for(const e of b.employees||[]){if(!e.id||!e.name?.trim()||!Number.isFinite(e.opening))throw Error('بيانات موظف غير صالحة');}for(const r of b.employeeEntries||[]){if(!Object.hasOwn(employeeKinds,r.type)||!Number.isFinite(r.amount)||r.amount<=0||!(b.employees||[]).some(e=>e.id===r.employeeId))throw Error('حركة موظف غير صالحة');}return b;}
function employees(){if(!isOwner())return '';const people=B().employees||[];if(employeeFocus){const e=people.find(e=>e.id===employeeFocus);if(!e){employeeFocus=null;return employees();}const current=employeeBalance(B(),e.id),entries=(B().employeeEntries||[]).filter(r=>r.employeeId===e.id&&!r.cancelled);return `<div class="sectionhead"><div><h2>${esc(e.name)}</h2><p class="muted">${esc(e.phone)} • ${esc(e.note)}</p></div><div class="flow">${button('كل الموظفين','employeesback')}${button('تعديل الرصيد القديم والبيانات','editemployee',e.id)}${button('صرف له / سلفة','employeepay',e.id,'primary')}${button('+ حركة على الحساب','employeeentry',e.id)}${button('طباعة / PDF','print')}</div></div><div class="stats">${stat(current>=0?'الموظف له عند المكان':'الموظف عليه للمكان',Math.abs(current),'الرصيد الحالي بعد كل الحركات')}${stat('مصروفات دفعها من جيبه',sum(entries.filter(r=>r.type==='expense').map(r=>r.amount)))}${stat('فلوس استلمها من المكان',sum(entries.filter(r=>r.type==='payment').map(r=>r.amount)))}${stat('فلوس رجعها للمكان',sum(entries.filter(r=>r.type==='returned').map(r=>r.amount)))}</div>${section('كشف حساب الموظف',table(['التاريخ','الحركة','البيان','زيادة له','استلم / عليه','الرصيد','إجراء'],employeeLedger(B(),e.id).map(r=>tr([r.date==='0000-01-01'?'افتتاحي':r.date,esc(r.type),esc(r.note),money(r.credit),money(r.debit),money(r.balance)+(r.balance>=0?' <small>له</small>':' <small>عليه</small>'),r.id==='opening'?'—':button('تعديل','editemployeeentry',r.id)+button('إلغاء','cancelemployeeentry',r.id,'danger')]))))}${note('الموجب يعني الموظف له فلوس، والسالب يعني عليه فلوس. مصروف الشغل أو الأجر يُحسب مرة واحدة عند تسجيل استحقاقه؛ الفلوس اللي تصرفها له بعدها تتسجّل خروج وتسوية للحساب، ولا تُخصم من الربح مرة ثانية.')}`;}
const owed=sum(people.map(e=>Math.max(0,employeeBalance(B(),e.id)))),debts=sum(people.map(e=>Math.max(0,-employeeBalance(B(),e.id))));return `<div class="sectionhead"><p class="muted">حسابات الموظفين المالية مستقلة عن صلاحيات دخول النظام.</p><div class="flow">${button('+ موظف ورصيد قديم','newemployee','','primary')}${button('تسجيل حركة موظف','employeeentry')}</div></div><div class="stats">${stat('مستحق للموظفين عند المكان',owed)}${stat('مستحق للمكان عند الموظفين',debts)}${stat('صافي حسابات الموظفين',round(owed-debts),'الموجب التزام على المكان')}</div>${searchBar('بحث باسم الموظف أو رقم الموبايل')}${section('الموظفين وحساباتهم',table(['الموظف','رقم الموبايل','له عند المكان','عليه للمكان','إجراءات'],people.filter(e=>match(e.name+' '+e.phone)).map(e=>{const balance=employeeBalance(B(),e.id);return tr([esc(e.name),esc(e.phone),money(Math.max(0,balance)),money(Math.max(0,-balance)),button('كشف حساب','employee',e.id)+button('صرف له','employeepay',e.id)]);}),'أضف كل موظف ورصيده القديم؛ مش محتاج يكون له حساب دخول على النظام.'))}`;}
function employeeForm(id){if(!isOwner())return;const e=(B().employees||[]).find(e=>e.id===id)||{id:uid(),name:'',phone:'',opening:0,openingDate:today(),note:''};modal(id?'بيانات الموظف ورصيده القديم':'موظف جديد',`<div class="fieldgrid">${field('اسم الموظف','name',e.name,'text','required')}${field('رقم الموبايل — اختياري','phone',e.phone)}${num('الرصيد القديم — موجب لو له / سالب لو عليه','opening',e.opening,'')}${field('تاريخ الرصيد القديم','openingDate',e.openingDate,'date','required')}<label class="full">ملاحظات<textarea name="note">${esc(e.note)}</textarea></label></div>`,f=>change('بيانات موظف '+f.get('name'),b=>{const value={...e,name:String(f.get('name')).trim(),phone:String(f.get('phone')),opening:round(f.get('opening')),openingDate:String(f.get('openingDate')),note:String(f.get('note'))};b.employees||=[];const idx=b.employees.findIndex(x=>x.id===e.id);idx<0?b.employees.push(value):b.employees[idx]=value;validateEmployees(b);}));}
function employeeEntryForm(employeeId='',id='',initialType='expense'){if(!isOwner())return;if(!(B().employees||[]).length){toast('أضف موظف الأول');employeeForm();return;}const old=(B().employeeEntries||[]).find(e=>e.id===id);if(old?.cancelled){toast('الحركة ملغاة؛ سجّل حركة جديدة');return;}const e=old||{id:uid(),employeeId:employeeId||(B().employees||[])[0].id,type:initialType,amount:0,date:today(),note:'',reference:''};modal(id?'تعديل حركة موظف':'حركة على حساب الموظف',`<div class="fieldgrid"><label>الموظف<select name="employeeId">${options(B().employees,e.employeeId)}</select></label><label>نوع الحركة<select name="type">${Object.entries(employeeKinds).map(([k,label])=>`<option value="${k}" ${k===e.type?'selected':''}>${label}</option>`).join('')}</select></label>${num('المبلغ','amount',e.amount,'min="0.01"')}${field('التاريخ','date',e.date,'date','required')}${field('البيان / الفاتورة التي دفعها','note',e.note,'text','required')}${field('مرجع الدفع — اختياري','reference',e.reference)}</div>${note('لو الموظف دفع فاتورة شغل من جيبه، سجّلها هنا فقط. لو اشترى خامات أو ماكينة اختار «شراء خامات / أصل» وسجلها في الجرد بشكل منفصل. لما تديه الفلوس اختار «صرف له»؛ رصيده يقل، ولو استلم أكتر من حقه الزيادة تتسجّل عليه.')}`,f=>change(employeeKinds[f.get('type')]+' • '+f.get('note'),b=>recordEmployeeEntry(b,{...e,employeeId:String(f.get('employeeId')),type:String(f.get('type')),amount:round(f.get('amount')),date:String(f.get('date')),note:String(f.get('note')).trim(),reference:String(f.get('reference')),cancelled:false})));
}

function bindPage(){bindQuickForms();$('#search')?.addEventListener('input',e=>{search=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);});for(const name of ['from','to'])$('#'+name)?.addEventListener('change',e=>{if(name==='from')from=e.target.value;else to=e.target.value;render();});$('#settingsform')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await change('تحديث بيانات المصنع',b=>b.settings={factory:String(f.get('factory')),phone:String(f.get('phone')),instapay:String(f.get('instapay'))});}catch(err){toast(err.message)}});}

async function lock(revoke=true){const previous=state?.session;authGeneration++;forgetSession();state=null;email='';netBlocked=false;busy=false;printView=null;customerFocus=null;$('#connection').hidden=true;$('#modal').close();authScreen();if(revoke&&previous&&navigator.onLine){try{await fetch(CLOUD.url+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:CLOUD.key,Authorization:'Bearer '+previous.access_token},signal:AbortSignal.timeout(6000)});}catch{}}}
document.addEventListener('submit',async e=>{if(e.target.id!=='auth')return;e.preventDefault();const btn=e.submitter;btn.disabled=true;try{await authenticate(e.target);}catch(err){if(state){toast(err.message);render();}else $('#autherr').textContent=err.message;}finally{btn.disabled=false;}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;if(busy&&!['closemodal'].includes(a)){toast('انتظر انتهاء المزامنة');return;}try{if(netBlocked&&!['retry','lock','closemodal'].includes(a))return;if(state&&!['retry','lock','closemodal'].includes(a))online();switch(a){case 'newemployee':employeeForm();break;case 'editemployee':employeeForm(id);break;case 'employee':if(isOwner()){employeeFocus=id;page='employees';printView=null;render();}break;case 'employeesback':employeeFocus=null;render();break;case 'employeeentry':employeeEntryForm(id);break;case 'employeepay':employeeEntryForm(id,'','payment');break;case 'editemployeeentry':employeeEntryForm('',id);break;case 'cancelemployeeentry':if(isOwner()&&confirm('إلغاء حركة الموظف والحركة المالية المرتبطة بها؟'))await change('إلغاء حركة موظف',b=>{const entry=b.employeeEntries.find(e=>e.id===id);recordEmployeeEntry(b,{...entry,cancelled:true});});break;case 'quickexpense':quickModal('expense');break;case 'quickincome':quickModal('income');break;case 'newasset':assetForm();break;case 'editasset':assetForm(id);break;case 'removeasset':if(isOwner()&&confirm('إزالة البند من قيمة جرد المكان؟'))await change('إزالة موجود من جرد المكان',b=>b.capitalAssets.find(a=>a.id===id).removed=true);break;case 'staffsignup':signupStaff();break;case 'addstaff':staffForm();break;case 'removestaff':staffForm(true);break;case 'customerlink':await customerLink(id);break;case 'rotatelink':if(confirm('تغيير الرابط سيوقف الرابط القديم. نكمل؟'))await customerLink(id,true);break;case 'revokelink':if(confirm('إلغاء وصول العميل بهذا الرابط؟'))await customerLink(id,false,true);break;case 'copycustomerurl':{const input=$('#customerurl');input.select();try{await navigator.clipboard.writeText(input.value);toast('تم نسخ رابط العميل');}catch{toast('حدد الرابط وانسخه من الخانة');}break;}case 'retry':netBlocked=false;$('#connection').hidden=true;try{if(state){await sync();render();}else{await restoreRemembered();if(!navigator.onLine)pauseConnection();}}catch(err){pauseConnection(err.message);}break;case 'page':await sync();employeeFocus=null;page=id;search='';printView=null;customerFocus=null;render();break;case 'sync':await sync();toast('تم تحديث البيانات من الخادم');render();break;case 'lock':await lock();break;case 'closemodal':$('#modal').close();break;case 'newcustomer':customerForm();break;case 'editcustomer':customerForm(id);break;case 'customer':customerFocus=id;page='customers';render();break;case 'backcustomers':customerFocus=null;render();break;case 'newproduct':productForm();break;case 'editproduct':productForm(id);break;case 'editquantity':quantityForm(id);break;case 'editstock':stockForm(id);break;case 'restorestock':if(confirm('استرجاع الحركة وإعادة تأثيرها على رصيد المخزون؟'))await change('استرجاع حركة جرد',b=>{b.stock.find(s=>s.id===id).cancelled=false;});break;case 'newstock':stockForm();break;case 'newinvoice':invoiceForm();break;case 'newreturn':invoiceForm(null,true);break;case 'editinvoice':invoiceForm(id);break;case 'viewinvoice':page='invoices';printView=id;render();break;case 'closeprint':printView=null;render();break;case 'cancelinvoice':await cancelInvoice(id);break;case 'newmovement':movementForm(null,id||'receipt');break;case 'editmovement':movementForm(id);break;case 'paycustomer':movementForm(null,'receipt',id);break;case 'payinvoice':{const i=B().invoices.find(x=>x.id===id);movementForm(null,'receipt',i.customerId,i.id);break;}case 'cancelmovement':if(confirm('إلغاء الحركة مع الاحتفاظ بسجلها؟'))await change('إلغاء حركة '+id,b=>b.movements.find(m=>m.id===id).cancelled=true);break;case 'cancelstock':if(confirm('إلغاء حركة الجرد مع الاحتفاظ بسجلها؟'))await change('إلغاء حركة جرد '+id,b=>{b.stock.find(s=>s.id===id).cancelled=true;});break;case 'print':window.print();break;case 'backup':await backup();break;case 'ledgercsv':csv('X-Laser-ledger-'+today()+'.csv',[['التاريخ','المرجع','البيان','عليه','له','الرصيد'],...ledger(B(),id).map(r=>[r.date,r.ref,r.note,r.debit,r.credit,r.balance])]);break;case 'reportcsv':{const r=report(B(),from,to);csv('X-Laser-profit-'+today()+'.csv',[['من',from,'إلى',to],['البند','القيمة'],['صافي المبيعات',r.sales],['تكلفة المبيعات',r.cost],['مصروفات',r.expense],['إيرادات أخرى',r.other],['صافي الربح',r.profit]]);break;}}}catch(err){toast(err.message);}});

window.addEventListener('online',async()=>{if(netBlocked){netBlocked=false;$('#connection').hidden=true;try{if(state){await sync();render();}else await restoreRemembered();}catch(err){pauseConnection(err.message);}}});
window.addEventListener('offline',()=>pauseConnection());
document.addEventListener('pointerdown',()=>lastActivity=Date.now());document.addEventListener('keydown',()=>lastActivity=Date.now());
window.addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue='';}});

setInterval(()=>{if(state&&!netBlocked&&navigator.onLine)sync().catch(e=>toast(e.message));},15000);

authScreen();
restoreRemembered().catch(e=>pauseConnection(e.message));
if(!navigator.onLine)pauseConnection();

})();</script></body></html>
